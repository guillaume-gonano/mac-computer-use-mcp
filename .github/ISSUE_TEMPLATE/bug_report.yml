name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked the agent, what it did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mac-computer-use-mcp doctor`
      render: text
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and model
      placeholder: Claude Code 2.x with …, Codex …, Cursor …
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App the agent was using, with its version
      placeholder: TextEdit 1.20, Notes, Figma …
  - type: textarea
    id: tool
    attributes:
      label: Tool call and its result (optional)
      description: The failing tool call and what it returned. Remove anything private first, since accessibility trees contain window content.
      render: text
