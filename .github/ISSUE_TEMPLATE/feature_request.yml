name: Idea or feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The task your agent can't do today, and in which app.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
