name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Smoke test (MCP handshake with the real binary)
        run: scripts/smoke-test.sh
      - name: App bundle
        run: scripts/build-app.sh "$RUNNER_TEMP"
