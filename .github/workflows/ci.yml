name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Smoke test (MCP handshake with the real binary)
        run: scripts/smoke-test.sh
      - name: App bundle, and the smoke test from it (restarted as its own responsible process)
        run: |
          APP="$(scripts/build-app.sh "$RUNNER_TEMP")"
          scripts/smoke-test.sh "$APP/Contents/MacOS/mac-computer-use-mcp"
